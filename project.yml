name: SnapKeep
options:
  bundleIdPrefix: com.snapkeep
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: true

targets:
  SnapKeep:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: 快拍收據夾
        UILaunchScreen: {}
        NSCameraUsageDescription: 需要使用相機拍攝收據照片，所有處理均在本機完成，不會上傳到任何伺服器。
        NSPhotoLibraryUsageDescription: 需要存取相簿以選取收據照片，所有處理均在本機完成，不會上傳到任何伺服器。
        NSPhotoLibraryAddUsageDescription: 需要將匯出的收據報表儲存到相簿。
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snapkeep.app
        PRODUCT_NAME: SnapKeep
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
    entitlements:
      path: Sources/App/SnapKeep.entitlements
      properties: {}

  SnapKeepTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SnapKeepTests
    dependencies:
      - target: SnapKeep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snapkeep.apptests

schemes:
  SnapKeep:
    build:
      targets:
        SnapKeep: all
        SnapKeepTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SnapKeepTests
    archive:
      config: Release
